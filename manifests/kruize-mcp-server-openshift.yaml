apiVersion: apps/v1
kind: Deployment
metadata:
  name: kruize-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kruize-mcp-server
  template:
    metadata:
      labels:
        app: kruize-mcp-server
    spec:
      containers:
        - name: kruize-mcp-server
          image: quay.io/shbirada/kruize-mcp-server:v3
          # Set the environment variable inside the container
          env:
            - name: KRUIZE_URL
              # Use the stable Service DNS name.
              # Format: http://<service-name>.<namespace>:<port>
              value: "http://kruize.openshift-tuning:8080"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "250Mi"
              cpu: "0.5"
            limits:
              memory: "250Mi"
              cpu: "0.5"

---
apiVersion: v1
kind: Service
metadata:
  name: kruize-mcp-server-service
spec:
  selector:
    app: kruize-mcp-server
  ports:
    - name: kruize-mcp-server-port
      port: 8080
      targetPort: 8080

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kruize-mcp-server-service
  annotations:
    # Prevent HAProxy from closing SSE connections - Critical for MCP streaming
    haproxy.router.openshift.io/timeout: 5m
    # Disable cookies for SSE streaming compatibility
    haproxy.router.openshift.io/disable_cookies: "true"
    # Use source-based load balancing to keep SSE connections sticky
    haproxy.router.openshift.io/balance: source
spec:
  port:
    targetPort: kruize-mcp-server-port
  to:
    kind: Service
    name: kruize-mcp-server-service
    weight: 100
  wildcardPolicy: None
